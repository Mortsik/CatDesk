name: Windows verification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Windows
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: rustup toolchain install stable --profile minimal

      - name: Run Windows browser tests
        shell: pwsh
        run: cargo +stable test browser::tests --locked

      - name: Run full test suite
        shell: pwsh
        run: cargo +stable test --locked -- --test-threads 2

  build:
    name: Build release on Windows
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: rustup toolchain install stable --profile minimal

      - name: Build release binary
        shell: pwsh
        run: cargo +stable build --release --locked

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: catdesk-windows-x64
          path: target/release/catdesk.exe
          if-no-files-found: error
