# CatDesk reliability override for an external cloudflared user service.
# Install as ~/.config/systemd/user/cloudflared.service.d/20-catdesk-reliability.conf,
# then run: systemctl --user daemon-reload && systemctl --user restart cloudflared.service
#
# HTTP/2 avoids the UDP/QUIC path when cloudflared prechecks report QUIC failures.
# MemoryLow protects a small working set under memory pressure; it is not a RAM cap.
[Service]
Environment=TUNNEL_TRANSPORT_PROTOCOL=http2
OOMScoreAdjust=0
MemoryLow=64M
Restart=always
RestartSec=1s
